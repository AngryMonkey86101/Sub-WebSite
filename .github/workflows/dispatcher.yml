# Диспетчер в РФ (dispatcher/): тесты на каждый пуш и пул-реквест с изменениями в dispatcher/.
name: Dispatcher

on:
  push:
    branches: [main]
    paths: ['dispatcher/**', '.github/workflows/dispatcher.yml']
  pull_request:
    paths: ['dispatcher/**', '.github/workflows/dispatcher.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Тесты диспетчера
        working-directory: dispatcher
        run: npm test
