# Диспетчер в РФ (README.md рядом). Запуск: docker compose up -d --build
# Настройки — в .env рядом (образец — .env.example).
services:
  dispatcher:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.4-alpine3.24}
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
    # служба — не PID 1: её может убить health.js, когда она встала целиком (src/hang.js)
    init: true
    # Docker сам «нездоровый» контейнер не перезапускает: health.js убивает службу, и контейнер
    # перезапускается по restart
    healthcheck:
      test: ["CMD", "node", "src/health.js"]
      interval: 1m
      timeout: 20s
      retries: 1
      start_period: 5m
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

volumes:
  data:
