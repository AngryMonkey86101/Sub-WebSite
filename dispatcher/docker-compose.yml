# Диспетчер в РФ (README.md рядом). Запуск: docker compose up -d --build
# Настройки — в .env рядом (образец — .env.example).
services:
  dispatcher:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.4-alpine3.24}
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

volumes:
  data:
